{% extends "base.html" %}
{% block title %}{{ audio.title }} - 播放{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow text-center p-5">
            <h3>{{ audio.title }}</h3>
            <p class="text-muted">分类：{{ audio.category }}｜播放量：{{ audio.play_count }}</p>
            <hr>
            <audio controls class="w-100 mt-4">
                <source src="{{ audio.file_path }}" type="audio/mpeg">
                您的浏览器不支持音频播放
            
            <div class="mt-4">
                <a href="{{ url_for('audio.audio_list') }}" class="btn btn-secondary">返回列表</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
